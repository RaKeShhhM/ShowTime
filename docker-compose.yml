services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: production
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      target: production
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
