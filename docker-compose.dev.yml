services:
  server:
    build:
      target: development
    command: npm run server
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      target: build
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
